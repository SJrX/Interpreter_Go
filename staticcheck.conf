# Default checks, minus known findings that are tracked for a separate fix.
#
# SA4023: ParseProgram and parseBlockStatement compare the ast.Statement
# returned by parseStatement against nil. parseStatement returns typed nil
# pointers (e.g. a nil *ast.LetStatement) when a statement fails to parse, so
# the comparison is always true and nil statements end up in the AST.
# Remove this exclusion once that is fixed.
checks = ["inherit", "-SA4023"]
